# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install fonts on Ubuntu
        if: runner.os == 'Linux'
        run: |
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu python3-fontforge
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: covr

      - name: Generate Dotaro fonts with FontForge
        if: runner.os == 'Linux'
        env:
          RETICULATE_PYTHON: /usr/bin/python3
        run: |
          dir <- file.path(Sys.getenv("HOME"), ".local", "share", "fonts")
          dir.create(dir, recursive = TRUE, showWarnings = FALSE)
          for (font in c("ranks", "suits")) {
            sfd <- tempfile(fileext = ".sfd")
            dotaro.font::generate_sfd(font, sfd)
            dotaro.font::generate_font(sfd, file.path(dir, paste0("dotaro-", font, ".ttf")))
          }
          system("fc-cache -f")
          stopifnot(system("fc-list | grep -q \"Dotaro Ranks\" && fc-list | grep -q \"Dotaro Suits\"") == 0L)
        shell: Rscript {0}

      - name: Test coverage
        run: covr::codecov()
        shell: Rscript {0}
