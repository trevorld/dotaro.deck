# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install fonts on Ubuntu
        if: runner.os == 'Linux'
        run: |
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu lcdf-typetools
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: covr

      - name: Install Dotaro fonts
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.local/share/fonts
          for font in ranks suits; do
            curl -fsSL -o ~/.local/share/fonts/dotaro-$font.ttf https://trevorldavis.com/share/fonts/dotaro-$font.ttf
          done
          fc-cache -f
          fc-list | grep -q "Dotaro Ranks"
          fc-list | grep -q "Dotaro Suits"
          # the fonts' version string is set from the `{dotaro.font}` version that generated them
          expected=$(Rscript -e 'cat(format(packageVersion("dotaro.font")))')
          for font in ranks suits; do
            actual=$(otfinfo -v ~/.local/share/fonts/dotaro-$font.ttf | awk '{print $2}')
            if [ "$actual" != "$expected" ]; then
              echo "::error::dotaro-$font.ttf is version $actual but {dotaro.font} is $expected; redeploy the fonts to trevorldavis.com"
              exit 1
            fi
          done
        shell: bash

      - name: Test coverage
        run: covr::codecov()
        shell: Rscript {0}
