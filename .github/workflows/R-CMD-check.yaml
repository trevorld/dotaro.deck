# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # - {os: macOS-latest,   r: 'release'}
          # - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # - if: runner.os == 'macOS'
      #   run: brew install --cask xquartz

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install fonts on Ubuntu
        if: runner.os == 'Linux'
        run: |
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu python3-fontforge
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Generate Dotaro fonts with FontForge
        if: runner.os == 'Linux'
        env:
          RETICULATE_PYTHON: /usr/bin/python3
        run: |
          dir <- file.path(Sys.getenv("HOME"), ".local", "share", "fonts")
          dir.create(dir, recursive = TRUE, showWarnings = FALSE)
          for (font in c("ranks", "suits")) {
            sfd <- tempfile(fileext = ".sfd")
            dotaro.font::generate_sfd(font, sfd)
            dotaro.font::generate_font(sfd, file.path(dir, paste0("dotaro-", font, ".ttf")))
          }
          system("fc-cache -f")
          stopifnot(system("fc-list | grep -q \"Dotaro Ranks\" && fc-list | grep -q \"Dotaro Suits\"") == 0L)
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        # with:
        #   upload-snapshots: true
        #   build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
